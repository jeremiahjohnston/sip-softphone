[package]
name = "sip-softphone"
version = "0.1.0"
edition = "2021"
description = "A simple SIP softphone"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sipcore = { path = "../sipcore" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
