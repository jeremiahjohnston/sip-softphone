# Builds the app for Windows and macOS on every push. Download the results
# from the run's "Artifacts" section on the Actions tab.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-windows-${{ hashFiles('scripts/build-pjsip-windows.ps1') }}
      - name: Build PJSIP
        shell: pwsh
        run: |
          if (-not (Test-Path deps/pjproject/lib/*.lib)) { ./scripts/build-pjsip-windows.ps1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        shell: pwsh
        run: |
          $env:PJSIP_DIR = "$PWD/deps/pjproject"
          npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-windows
          path: |
            target/release/sip-softphone.exe
            target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-macos-${{ hashFiles('scripts/build-pjsip-macos.sh') }}
      - name: Build PJSIP
        run: |
          [ -f deps/pjsip/lib/pkgconfig/libpjproject.pc ] || ./scripts/build-pjsip-macos.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: |
          export PJSIP_DIR="$PWD/deps/pjsip"
          npx --yes @tauri-apps/cli@2 build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-macos
          path: target/release/bundle/dmg/*.dmg
