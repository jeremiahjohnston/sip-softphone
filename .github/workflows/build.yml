# Builds the app for Windows and macOS on every push. Download the results
# from the run's "Artifacts" section on the Actions tab.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-windows-${{ hashFiles('scripts/build-pjsip-windows.ps1') }}
      - name: Build PJSIP
        shell: pwsh
        run: |
          if (-not (Test-Path deps/pjproject/lib/*.lib)) { ./scripts/build-pjsip-windows.ps1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        shell: pwsh
        run: |
          $env:PJSIP_DIR = "$PWD/deps/pjproject"
          npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-windows
          path: |
            target/release/sip-softphone.exe
            target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-macos-${{ hashFiles('scripts/build-pjsip-macos.sh') }}
      - name: Build PJSIP
        run: |
          [ -f deps/pjsip/lib/pkgconfig/libpjproject.pc ] || ./scripts/build-pjsip-macos.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: |
          export PJSIP_DIR="$PWD/deps/pjsip"
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --bundles dmg 2>&1 | tee build.log
      - name: Inspect app
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sp "$dmg" >/dev/null
          app=$(ls -d /tmp/sp/*.app | head -1)
          info=$(plutil -p "$app/Contents/Info.plist" | grep -E "Microphone|CFBundleIdentifier|LSMinimum"  || true)
          sig=$(codesign -dv --entitlements - "$app" 2>&1 | grep -E "Signature|flags|audio-input|Identifier"  || true)
          libs=$(otool -L "$app/Contents/MacOS/sip-softphone" | grep -iE "audio|coreaudio"  || true)
          devs=$(nm "$app/Contents/MacOS/sip-softphone" | grep -ciE "coreaudio_factory|ca_factory" || true)
          hdiutil detach /tmp/sp >/dev/null
          msg="$info"$'\n'"$sig"$'\n'"$libs"$'\n'"coreaudio factory symbols: $devs"
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=macOS app::$msg"
      - name: Report build errors
        if: failure()
        run: |
          # Surface the end of the log as an annotation so it shows on the run summary.
          [ -f build.log ] || exit 0
          # Skip the huge linker command line; keep what the linker said.
          msg=$(sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v '"cc"' | grep -iE -A40 "error|undefined" | cut -c1-300 | tail -60)
          [ -n "$msg" ] || msg=$(tail -40 build.log | cut -c1-300)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=macOS build::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-macos
          path: target/release/bundle/dmg/*.dmg

  linux:
    # Oldest supported Ubuntu, so the binaries run on as many distros as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev file libdbus-1-dev
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-linux-${{ hashFiles('scripts/build-pjsip-linux.sh') }}
      - name: Build PJSIP
        run: |
          [ -f deps/pjsip/lib/pkgconfig/libpjproject.pc ] || ./scripts/build-pjsip-linux.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: |
          export PJSIP_DIR="$PWD/deps/pjsip"
          npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
