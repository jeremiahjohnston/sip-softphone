# Builds the app for Windows, macOS and Linux on every push. Download the
# results from the run's "Artifacts" section on the Actions tab. Pushes to main
# also publish a GitHub Release that the app's built-in updater installs from.
name: build

on:
  push:
  workflow_dispatch:

env:
  # Signs the update files. Without it the builds still work, but no release
  # is published. Create one with: npx @tauri-apps/cli signer generate
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # Optional: publish releases to another (e.g. public) repository instead.
  RELEASE_REPO: ${{ vars.RELEASE_REPO }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-windows-${{ hashFiles('scripts/build-pjsip-windows.ps1', 'scripts/pjsip-patches/*.patch') }}
      - name: Build PJSIP
        shell: pwsh
        run: |
          if (-not (Test-Path deps/pjproject/lib/*.lib)) { ./scripts/build-pjsip-windows.ps1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version and update settings
        shell: bash
        run: bash scripts/ci-tauri-config.sh tauri.ci.json
      - name: Build app
        shell: pwsh
        run: |
          $env:PJSIP_DIR = "$PWD/deps/pjproject"
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config tauri.ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-windows
          path: |
            target/release/sip-softphone.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-macos-${{ hashFiles('scripts/build-pjsip-macos.sh', 'scripts/pjsip-patches/*.patch') }}
      - name: Build PJSIP
        run: |
          [ -f deps/pjsip/lib/pkgconfig/libpjproject.pc ] || ./scripts/build-pjsip-macos.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        env:
          # Optional: sign with an Apple Developer ID and notarize, so macOS opens
          # the app without the "damaged" warning. See "macOS signing" in the README.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing secrets arrive as empty strings; Tauri treats any set
          # variable as a request to sign or notarize, so drop the empty ones.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning title=macOS signing::No APPLE_CERTIFICATE secret, so the app is ad-hoc signed and macOS will call it damaged after download."
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::warning title=macOS notarization::Signed with the Developer ID but not notarized: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID."
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          bash scripts/ci-tauri-config.sh tauri.ci.json
          export PJSIP_DIR="$PWD/deps/pjsip"
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --bundles app,dmg --config tauri.ci.json 2>&1 | tee build.log
      - name: Inspect app
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sp "$dmg" >/dev/null
          app=$(ls -d /tmp/sp/*.app | head -1)
          info=$(plutil -p "$app/Contents/Info.plist" | grep -E "Microphone|CFBundleIdentifier|LSMinimum"  || true)
          sig=$(codesign -dv --entitlements - "$app" 2>&1 | grep -E "Signature|flags|audio-input|Identifier"  || true)
          libs=$(otool -L "$app/Contents/MacOS/sip-softphone" | grep -iE "audio|coreaudio"  || true)
          devs=$(nm "$app/Contents/MacOS/sip-softphone" | grep -ciE "coreaudio_factory|ca_factory" || true)
          # "accepted, source=Notarized Developer ID" means it opens without warnings.
          gk=$(spctl -a -vv -t exec "$app" 2>&1 || true)
          hdiutil detach /tmp/sp >/dev/null
          msg="$info"$'\n'"$sig"$'\n'"$libs"$'\n'"coreaudio factory symbols: $devs"$'\n'"Gatekeeper: $gk"
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=macOS app::$msg"
      - name: Check install script
        run: |
          # The parts of scripts/install-macos.sh that depend on this build's output.
          feed='{"version":"1.2.3","platforms":{"darwin-aarch64":{"url":"https://example.com/a.tar.gz"}}}'
          [ "$(printf '%s' "$feed" | plutil -extract platforms.darwin-aarch64.url raw -o - -)" = https://example.com/a.tar.gz ]
          [ "$(printf '%s' "$feed" | plutil -extract version raw -o - -)" = 1.2.3 ]
          tgz=$(ls target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          [ -z "$tgz" ] || tar -tzf "$tgz" | grep -q '^SIP Softphone.app/'
          bash -n scripts/install-macos.sh
      - name: Report build errors
        if: failure()
        run: |
          # Surface the end of the log as an annotation so it shows on the run summary.
          [ -f build.log ] || exit 0
          # Skip the huge linker command line; keep what the linker said.
          msg=$(sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v '"cc"' | grep -iE -A40 "error|undefined" | cut -c1-300 | tail -60)
          [ -n "$msg" ] || msg=$(tail -40 build.log | cut -c1-300)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=macOS build::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

  linux:
    # Oldest supported Ubuntu, so the binaries run on as many distros as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev file libdbus-1-dev
      - uses: actions/cache@v4
        with:
          path: deps
          key: pjsip-linux-${{ hashFiles('scripts/build-pjsip-linux.sh', 'scripts/pjsip-patches/*.patch') }}
      - name: Build PJSIP
        run: |
          [ -f deps/pjsip/lib/pkgconfig/libpjproject.pc ] || ./scripts/build-pjsip-linux.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version and update settings
        run: bash scripts/ci-tauri-config.sh tauri.ci.json
      - name: Build app
        run: |
          export PJSIP_DIR="$PWD/deps/pjsip"
          npx --yes @tauri-apps/cli@2 build --bundles deb,appimage --config tauri.ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: sip-softphone-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  release:
    # Every push to main becomes a release the app can update to.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key
        id: key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=No release::Add the TAURI_SIGNING_PRIVATE_KEY secret to publish releases the app can update to."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          path: artifacts
      - name: Publish release
        if: steps.key.outputs.ok == 'true'
        env:
          VERSION: 0.2.${{ github.run_number }}
          REPO: ${{ vars.RELEASE_REPO || github.repository }}
          # A token that can write to RELEASE_REPO; this repository's own token otherwise.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: bash scripts/make-release.sh artifacts
